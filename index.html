```html
<!DOCTYPE html>
<html lang="fa">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BLACK RADIO</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Vazirmatn',sans-serif;
}

body{

height:100vh;

display:flex;
justify-content:center;
align-items:center;

overflow:hidden;

background:black;

color:white;

position:relative;

}

/* BACKGROUND */

.bg{

position:absolute;

width:100%;
height:100%;

top:0;
left:0;

background-size:cover;
background-position:center;

filter:grayscale(100%) brightness(0.4);

transition:1.5s;

z-index:-2;

}

.overlay{

position:absolute;

width:100%;
height:100%;

background:rgba(0,0,0,0.55);

z-index:-1;

}

/* PARTICLES */

.particle{

position:absolute;

width:3px;
height:3px;

background:white;

border-radius:50%;

opacity:0.3;

animation:float 8s linear infinite;

}

@keyframes float{

from{
transform:translateY(100vh);
opacity:0;
}

to{
transform:translateY(-100vh);
opacity:0.6;
}

}

/* CARD */

.card{

width:90%;
max-width:420px;

background:rgba(255,255,255,0.04);

border:1px solid rgba(255,255,255,0.08);

backdrop-filter:blur(18px);

border-radius:35px;

padding:30px;

box-shadow:0 0 40px rgba(255,255,255,0.08);

}

/* DISK */

.disk{

width:220px;
height:220px;

border-radius:50%;

object-fit:cover;

display:block;

margin:auto;

border:5px solid rgba(255,255,255,0.15);

animation:spin 8s linear infinite;

box-shadow:0 0 30px rgba(255,255,255,0.15);

}

@keyframes spin{

from{
transform:rotate(0deg);
}

to{
transform:rotate(360deg);
}

}

/* TITLE */

.title{

text-align:center;

font-size:34px;
font-weight:700;

margin-top:25px;

letter-spacing:4px;

}

/* SONG */

.song{

text-align:center;

margin-top:18px;

font-size:18px;

color:#ddd;

}

/* AUDIO */

audio{

width:100%;

margin-top:25px;

filter:grayscale(100%);

}

/* BUTTON */

.btn{

width:100%;

padding:16px;

margin-top:20px;

border:none;

border-radius:18px;

background:white;

color:black;

font-size:16px;
font-weight:700;

cursor:pointer;

transition:0.3s;

}

.btn:hover{

transform:translateY(-4px);

background:#ddd;

}

/* ABOUT */

.about{

margin-top:22px;

text-align:center;

}

.about a{

display:inline-block;

padding:14px 24px;

border-radius:18px;

background:rgba(255,255,255,0.06);

border:1px solid rgba(255,255,255,0.08);

color:white;

text-decoration:none;

font-size:15px;

transition:0.3s;

}

.about a:hover{

background:white;

color:black;

transform:translateY(-4px);

}

/* MOBILE */

@media(max-width:500px){

.disk{

width:180px;
height:180px;

}

.title{

font-size:28px;

}

}

</style>

</head>

<body>

<div class="bg" id="bg"></div>

<div class="overlay"></div>

<div class="card">

<img class="disk"
src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?q=80&w=1200&auto=format&fit=crop">

<h1 class="title">
BLACK RADIO
</h1>

<div class="song" id="songName">
Loading...
</div>

<audio id="audio" controls></audio>

<button class="btn" onclick="playSong()">
PLAY RADIO
</button>

<div class="about">

<a href="https://aboutme.amirali-nasiri-200.workers.dev/"
target="_blank">

👤 درباره من

</a>

</div>

</div>

<script>

/* SONGS */

const songs = [

"https://uploadkon.ir/uploads/564429_26Dariush-Baradar-Jaan-Copy.mp3",

"https://uploadkon.ir/uploads/5faf29_26Dariush-Be-man-Nagoo-Dooset-Daram-Copy.mp3",

"https://uploadkon.ir/uploads/da6529_26Dariush-Bonbast.mp3",

"https://uploadkon.ir/uploads/e1b629_26Dariush-Booye-Gandom.mp3",

"https://uploadkon.ir/uploads/fff829_26Dariush-Cheshme-Man.mp3",

"https://uploadkon.ir/uploads/34f429_26Dariush-Faryad-Zire-Aab.mp3",

"https://uploadkon.ir/uploads/bdea29_26Dariush-Gelayeh.mp3",

"https://uploadkon.ir/uploads/064329_26Dariush-Gozashtehaye-Door.mp3",

"https://uploadkon.ir/uploads/b55629_26Dariush-Hasood.mp3",

"https://uploadkon.ir/uploads/26eb29_26Dariush-Khorshid-Khanoom.mp3",

"https://uploadkon.ir/uploads/aeaa29_26Dariush-Niyayesh.mp3"

];

/* BACKGROUNDS */

const backgrounds = [

"https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?q=80&w=1400&auto=format&fit=crop",

"https://images.unsplash.com/photo-1501612780327-45045538702b?q=80&w=1400&auto=format&fit=crop",

"https://images.unsplash.com/photo-1499364615650-ec38552f4f34?q=80&w=1400&auto=format&fit=crop",

"https://images.unsplash.com/photo-1470229722913-7c0e2dbbafd3?q=80&w=1400&auto=format&fit=crop"

];

/* BACKGROUND CHANGE */

let currentBg = 0;

const bg = document.getElementById("bg");

function changeBackground(){

bg.style.backgroundImage =
`url(${backgrounds[currentBg]})`;

currentBg++;

if(currentBg >= backgrounds.length){

currentBg = 0;

}

}

changeBackground();

setInterval(changeBackground,10000);

/* MUSIC */

let currentSong = 0;

const audio =
document.getElementById("audio");

const songName =
document.getElementById("songName");

function loadSong(index){

audio.src = songs[index];

songName.innerText = decodeURIComponent(

songs[index]
.split("/")
.pop()
.replace(".mp3","")
.replaceAll("-"," ")
.replaceAll("_"," ")

);

}

function playSong(){

audio.play();

}

function nextSong(){

currentSong++;

if(currentSong >= songs.length){

currentSong = 0;

}

loadSong(currentSong);

audio.play();

}

audio.addEventListener("ended", nextSong);

loadSong(currentSong);

/* PARTICLES */

for(let i=0;i<40;i++){

const particle =
document.createElement("div");

particle.classList.add("particle");

particle.style.left =
Math.random()*100+"vw";

particle.style.animationDuration =
(5 + Math.random()*10)+"s";

particle.style.opacity =
Math.random();

document.body.appendChild(particle);

}

</script>

</body>

</html>
