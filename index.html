```html
<!DOCTYPE html>
<html lang="fa">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BEN10 RADIO</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Vazirmatn',sans-serif;
}

body{

height:100vh;

display:flex;
justify-content:center;
align-items:center;

background:
radial-gradient(circle at top left,#00ff8840,transparent 30%),
radial-gradient(circle at bottom right,#00ff8840,transparent 30%),
#050816;

overflow:hidden;

padding:20px;

}

/* BACKGROUND */

.shape1{

position:absolute;

width:400px;
height:400px;

background:#00ff88;

filter:blur(180px);

opacity:0.15;

top:-150px;
left:-120px;

border-radius:50%;

animation:move1 10s infinite alternate;

}

.shape2{

position:absolute;

width:350px;
height:350px;

background:#00ff88;

filter:blur(180px);

opacity:0.1;

bottom:-150px;
right:-100px;

border-radius:50%;

animation:move2 12s infinite alternate;

}

@keyframes move1{

from{
transform:translateY(0px);
}

to{
transform:translateY(40px);
}

}

@keyframes move2{

from{
transform:translateX(0px);
}

to{
transform:translateX(-40px);
}

}

/* CARD */

.card{

width:100%;
max-width:420px;

background:rgba(255,255,255,0.04);

border:1px solid rgba(255,255,255,0.08);

backdrop-filter:blur(25px);

border-radius:40px;

padding:30px;

position:relative;

box-shadow:0 0 50px rgba(0,255,136,0.08);

z-index:2;

animation:float 5s ease-in-out infinite;

}

@keyframes float{

0%{
transform:translateY(0px);
}

50%{
transform:translateY(-10px);
}

100%{
transform:translateY(0px);
}

}

/* IMAGE */

.cover{

width:100%;
height:260px;

border-radius:30px;

object-fit:cover;

border:3px solid rgba(0,255,136,0.2);

box-shadow:0 0 30px rgba(0,255,136,0.2);

margin-bottom:25px;

}

/* TITLE */

.logo{

text-align:center;

font-size:35px;
font-weight:700;

color:#00ff88;

margin-bottom:20px;

text-shadow:0 0 20px #00ff88;

}

/* SONG */

.song{

text-align:center;

font-size:20px;
font-weight:600;

margin-bottom:10px;

word-break:break-word;

color:white;

}

.artist{

text-align:center;

color:#999;

margin-bottom:25px;

}

/* AUDIO */

audio{

width:100%;

margin-bottom:20px;

filter:hue-rotate(70deg);

}

/* BUTTON */

.btn{

width:100%;

padding:16px;

border:none;

border-radius:18px;

background:#38bdf8;

color:white;

font-size:16px;
font-weight:700;

cursor:pointer;

transition:0.3s;

box-shadow:0 0 25px rgba(56,189,248,0.3);

}

.btn:hover{

transform:scale(1.03);

box-shadow:0 0 40px #38bdf8;

}

/* ABOUT */

.about{

margin-top:20px;

text-align:center;

}

.about a{

color:#00ff88;

text-decoration:none;

font-size:16px;

}

/* MOBILE */

@media(max-width:500px){

.logo{

font-size:28px;

}

.cover{

height:220px;

}

.song{

font-size:17px;

}

}

</style>

</head>

<body>

<div class="shape1"></div>
<div class="shape2"></div>

<div class="card">

<div class="logo">
BEN10 RADIO
</div>

<img class="cover"
src="https://wallpapercave.com/wp/wp16354549.webp">

<div class="song" id="songName">
READY TO PLAY
</div>

<div class="artist">
24/7 Online Radio
</div>

<audio id="audio" controls></audio>

<button class="btn" onclick="playSong()">
▶ PLAY RADIO
</button>

<div class="about">

<a href="https://aboutme.amirali-nasiri-200.workers.dev/" target="_blank">

👤 About Me

</a>

</div>

</div>

<script>

const songs = [

"https://uploadkon.ir/uploads/564429_26Dariush-Baradar-Jaan-Copy.mp3",

"https://uploadkon.ir/uploads/5faf29_26Dariush-Be-man-Nagoo-Dooset-Daram-Copy.mp3",

"https://uploadkon.ir/uploads/da6529_26Dariush-Bonbast.mp3",

"https://uploadkon.ir/uploads/e1b629_26Dariush-Booye-Gandom.mp3",

"https://uploadkon.ir/uploads/fff829_26Dariush-Cheshme-Man.mp3",

"https://uploadkon.ir/uploads/34f429_26Dariush-Faryad-Zire-Aab.mp3",

"https://uploadkon.ir/uploads/bdea29_26Dariush-Gelayeh.mp3",

"https://uploadkon.ir/uploads/064329_26Dariush-Gozashtehaye-Door.mp3",

"https://uploadkon.ir/uploads/b55629_26Dariush-Hasood.mp3",

"https://uploadkon.ir/uploads/26eb29_26Dariush-Khorshid-Khanoom.mp3",

"https://uploadkon.ir/uploads/aeaa29_26Dariush-Niyayesh.mp3"

];

let currentSong = 0;

const audio = document.getElementById("audio");

const songName = document.getElementById("songName");

/* LOAD SONG */

function loadSong(index){

audio.src = songs[index];

const cleanName = songs[index]

.split("/")

.pop()

.replace(".mp3","")

.replaceAll("-"," ")

.replaceAll("_"," ");

songName.innerText = decodeURIComponent(cleanName);

}

/* PLAY */

function playSong(){

audio.play();

}

/* NEXT SONG */

function nextSong(){

currentSong++;

if(currentSong >= songs.length){

currentSong = 0;

}

loadSong(currentSong);

audio.play();

}

/* AUTO NEXT */

audio.addEventListener("ended", nextSong);

/* FIRST LOAD */

loadSong(currentSong);

</script>

</body>
</html>
