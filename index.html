<!DOCTYPE html>
<html lang="fa">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RADIO PROFILE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Vazirmatn',sans-serif;
}

body{

height:100vh;

display:flex;
justify-content:center;
align-items:center;

background:
radial-gradient(circle at top left,#00ff8840,transparent 30%),
radial-gradient(circle at bottom right,#00ff8840,transparent 30%),
#050816;

overflow:hidden;

padding:20px;

}

/* BACKGROUND */

.blur1{

position:absolute;

width:400px;
height:400px;

background:#00ff88;

filter:blur(180px);

opacity:0.15;

top:-150px;
left:-100px;

border-radius:50%;

animation:move1 8s infinite alternate;

}

.blur2{

position:absolute;

width:350px;
height:350px;

background:#00ff88;

filter:blur(180px);

opacity:0.1;

bottom:-120px;
right:-100px;

border-radius:50%;

animation:move2 10s infinite alternate;

}

@keyframes move1{

from{
transform:translateY(0px);
}

to{
transform:translateY(40px);
}

}

@keyframes move2{

from{
transform:translateX(0px);
}

to{
transform:translateX(-40px);
}

}

/* CARD */

.card{

width:100%;
max-width:430px;

background:rgba(255,255,255,0.04);

border:1px solid rgba(255,255,255,0.08);

backdrop-filter:blur(25px);

border-radius:40px;

padding:35px;

position:relative;

box-shadow:0 0 50px rgba(0,255,136,0.08);

z-index:2;

}

/* AVATAR */

.avatar-box{

display:flex;
justify-content:center;

margin-top:-110px;

}

.avatar{

width:190px;
height:190px;

border-radius:35px;

object-fit:cover;

border:4px solid rgba(0,255,136,0.3);

box-shadow:0 0 40px rgba(0,255,136,0.2);

}

/* NAME */

.name{

text-align:center;

font-size:36px;
font-weight:700;

margin-top:25px;

color:white;

}

.role{

width:max-content;

margin:18px auto;

padding:12px 22px;

border-radius:16px;

background:rgba(255,255,255,0.05);

border:1px solid rgba(255,255,255,0.08);

color:#00ff88;

font-size:15px;

}

/* SOCIALS */

.socials{

display:flex;
justify-content:center;
gap:18px;

margin-top:25px;
margin-bottom:35px;

}

.social{

width:65px;
height:65px;

border-radius:20px;

background:rgba(255,255,255,0.05);

border:1px solid rgba(255,255,255,0.08);

display:flex;
justify-content:center;
align-items:center;

font-size:30px;

text-decoration:none;

transition:0.3s;

color:white;

}

.social:hover{

transform:translateY(-5px);

background:#00ff88;

color:black;

box-shadow:0 0 25px #00ff88;

}

/* INFO */

.info-box{

background:rgba(255,255,255,0.03);

border:1px solid rgba(255,255,255,0.05);

border-radius:28px;

padding:20px;

display:flex;
flex-direction:column;
gap:15px;

}

.item{

background:rgba(0,0,0,0.25);

border-radius:18px;

padding:18px 20px;

display:flex;
justify-content:space-between;
align-items:center;

border:1px solid rgba(255,255,255,0.05);

}

.label{

color:#999;

font-size:14px;

}

.value{

color:white;

font-size:18px;

font-weight:500;

}

/* MOBILE */

@media(max-width:500px){

.card{

padding:25px;

}

.avatar{

width:160px;
height:160px;

}

.name{

font-size:28px;

}

.social{

width:58px;
height:58px;

}

}

</style>

</head>
